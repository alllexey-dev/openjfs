<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
    <title th:text="${preview.pageTitle}"></title>
    <meta name="description" th:content="${preview.description}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" th:content="${serverName}">
    <meta property="og:title" th:content="${preview.title}">
    <meta property="og:description" th:content="${preview.description}">
    <meta property="og:url" th:content="${previewUrl}">
    <meta property="og:image" th:if="${previewImageUrl}" th:content="${previewImageUrl}">
    <meta name="twitter:card" th:content="${previewImageUrl != null ? 'summary_large_image' : 'summary'}">
    <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<header class="header">
    <div class="header-inner">
        <a href="/ui" class="brand" data-path="" th:text="${serverName}"></a>
        <label class="search">
            <span class="search-icon" data-icon="search"></span>
            <input type="search" class="search-input" placeholder="Search" autocomplete="off" spellcheck="false"
                   enterkeyhint="search" aria-label="Search in this folder">
            <kbd class="search-hint">/</kbd>
        </label>
        <button type="button" class="icon-button account-button hidden" data-action="account" title="Admin">
            <span data-icon="user"></span><span class="account-label">Admin</span>
        </button>
    </div>
</header>

<main class="main">
    <div class="toolbar">
        <nav class="breadcrumbs" aria-label="Path"></nav>
        <div class="toolbar-actions">
            <button type="button" class="button primary upload-button admin-only" data-action="upload">
                <span data-icon="upload"></span><span>Upload</span>
            </button>
            <button type="button" class="icon-button" data-action="download-current" title="Download">
                <span data-icon="download"></span>
            </button>
            <button type="button" class="icon-button" data-action="share-current" title="Share link">
                <span data-icon="link"></span>
            </button>
            <button type="button" class="icon-button" data-action="more-current" title="More actions">
                <span data-icon="more"></span>
            </button>
        </div>
    </div>

    <section class="browser">
        <div class="list-summary">
            <span class="summary-text"></span>
            <label class="sort-select">
                <span data-icon="sort"></span>
                <select aria-label="Sort by">
                    <option value="name:1">Name A–Z</option>
                    <option value="name:-1">Name Z–A</option>
                    <option value="modified:-1">Newest first</option>
                    <option value="modified:1">Oldest first</option>
                    <option value="size:-1">Largest first</option>
                    <option value="size:1">Smallest first</option>
                </select>
            </label>
        </div>
        <div class="list-header">
            <span></span>
            <button type="button" data-sort="name">Name</button>
            <button type="button" data-sort="modified">Modified</button>
            <button type="button" data-sort="size">Size</button>
            <span></span>
        </div>
        <div class="list" role="list"></div>
    </section>

    <section class="readme hidden">
        <div class="readme-head">
            <span data-icon="text"></span>
            <span class="readme-name"></span>
        </div>
        <div class="readme-body markdown"></div>
    </section>

    <section class="viewer hidden">
        <div class="viewer-head">
            <span class="viewer-icon"></span>
            <div class="viewer-title">
                <h1 class="viewer-name"></h1>
                <div class="viewer-meta"></div>
            </div>
            <div class="viewer-actions">
                <button type="button" class="button primary" data-action="download-current">
                    <span data-icon="download"></span><span>Download</span>
                </button>
                <button type="button" class="button" data-action="share-current">
                    <span data-icon="link"></span><span>Share</span>
                </button>
                <button type="button" class="button icon-only" data-action="more-current" title="More actions"
                        aria-label="More actions">
                    <span data-icon="more"></span>
                </button>
            </div>
        </div>
        <div class="viewer-body"></div>
    </section>

    <div class="state hidden">
        <span class="state-icon"></span>
        <div class="state-title"></div>
        <div class="state-text"></div>
    </div>
</main>

<dialog class="sheet">
    <div class="sheet-head">
        <span class="sheet-icon"></span>
        <div class="sheet-title"></div>
    </div>
    <div class="sheet-actions">
        <button type="button" data-sheet-action="open"><span data-icon="open"></span><span>Open</span></button>
        <button type="button" data-sheet-action="download"><span data-icon="download"></span><span>Download</span></button>
        <button type="button" data-sheet-action="share"><span data-icon="link"></span><span>Share link</span></button>
        <button type="button" data-sheet-action="copy-download">
            <span data-icon="copy"></span><span>Copy download link</span>
        </button>
        <div class="sheet-admin admin-only">
            <button type="button" data-sheet-action="new-folder">
                <span data-icon="folderPlus"></span><span>New folder</span>
            </button>
            <button type="button" data-sheet-action="rename"><span data-icon="pencil"></span><span>Rename</span></button>
            <button type="button" data-sheet-action="move"><span data-icon="move"></span><span>Move</span></button>
            <button type="button" data-sheet-action="privacy">
                <span data-icon="lock"></span><span class="privacy-label">Make private</span>
            </button>
            <button type="button" class="danger" data-sheet-action="delete">
                <span data-icon="trash"></span><span>Move to trash</span>
            </button>
        </div>
    </div>
    <button type="button" class="sheet-cancel" data-sheet-action="close">Cancel</button>
</dialog>

<dialog class="modal">
    <form method="dialog" class="modal-form">
        <div class="modal-head">
            <h2 class="modal-title"></h2>
            <button type="button" class="icon-button" data-modal-close title="Close" aria-label="Close">
                <span data-icon="close"></span>
            </button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-error hidden" role="alert"></div>
        <div class="modal-actions">
            <button type="button" class="button" data-modal-close>Cancel</button>
            <button type="submit" class="button primary modal-submit">OK</button>
        </div>
    </form>
</dialog>

<button type="button" class="fab admin-only" data-action="upload" title="Upload files" aria-label="Upload files">
    <span data-icon="upload"></span>
</button>
<input type="file" class="upload-input" multiple hidden>

<div class="drop-overlay hidden">
    <div class="drop-overlay-inner">
        <span data-icon="upload"></span>
        <div class="drop-overlay-text"></div>
    </div>
</div>

<div class="uploads hidden" role="status">
    <div class="uploads-head">
        <span class="uploads-title"></span>
        <button type="button" class="icon-button" data-action="close-uploads" title="Hide" aria-label="Hide">
            <span data-icon="close"></span>
        </button>
    </div>
    <div class="uploads-list"></div>
</div>

<div class="toast" role="status" aria-live="polite"></div>

<script th:inline="javascript">
    window.OPENJFS = {
        allowDownloadDirs: /*[[${allowDownloadDirs}]]*/ false,
        searchMaxResults: /*[[${searchMaxResults}]]*/ 1000,
        serverName: /*[[${serverName}]]*/ 'openjfs',
        adminEnabled: /*[[${adminEnabled}]]*/ false,
        admin: /*[[${admin}]]*/ false
    };
</script>
<script src="/script.js"></script>
<script th:if="${adminEnabled}" src="/admin.js"></script>
</body>
</html>
